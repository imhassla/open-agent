# Opt-IN release: a push to main publishes a release ONLY when its commit
# message carries a release marker. No marker = a normal push, no release.
#   [release]         or [release:patch]  → bump the patch (x.y.Z)
#   [release:minor]                       → bump the minor (x.Y.0)
#   [release:major]                       → bump the major (X.0.0)
# A manual `git tag vX.Y.Z && git push origin vX.Y.Z` still releases that exact
# version (the tags trigger below).
#
# Each release: compute the version, tag it, build assets, publish the GitHub
# Release, and bump the Homebrew tap formula (imhassla/homebrew-tap) so
# `brew upgrade open-agent` tracks it.
#
# One-time setup for the brew bump: a PAT with contents:write on
# imhassla/homebrew-tap stored as the secret HOMEBREW_TAP_TOKEN in this repo
# (gh secret set HOMEBREW_TAP_TOKEN). Without it, the release still publishes;
# only the tap bump is skipped (with a notice).

name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need all tags to compute the next version

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Determine version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # Manual tag push: use it verbatim.
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Branch push: the marker must be a LINE OF ITS OWN — [release],
            # [release:patch], [release:minor], or [release:major] — so merely
            # mentioning it in prose (e.g. describing the policy) never triggers.
            # The coarse job-level `if` may pass on such prose; this precise
            # check is the real gate and sets release=false to skip cleanly.
            marker="$(git log -1 --format=%B | grep -m1 -xE '\[release(:(patch|minor|major))?\]' || true)"
            if [[ -z "${marker}" ]]; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "::notice::no [release] marker line in the commit — skipping release"
              exit 0
            fi
            latest="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
            latest="${latest:-v0.0.0}"
            base="${latest#v}"
            IFS=. read -r major minor patch <<< "${base}"
            case "${marker}" in
              '[release:major]') major=$((major + 1)); minor=0; patch=0 ;;
              '[release:minor]') minor=$((minor + 1)); patch=0 ;;
              *)                 patch=$((patch + 1)) ;;
            esac
            VERSION="${major}.${minor}.${patch}"
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "Releasing v${VERSION}"

      - name: Build release binaries
        if: steps.ver.outputs.release == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          : > dist/checksums.txt

          build() {
            local goos="$1" goarch="$2"
            local stage="open-agent_${VERSION}_${goos}_${goarch}"

            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w" -o open-agent .

            mkdir -p "dist/${stage}"
            cp open-agent README.md LICENSE "dist/${stage}/"
            tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
            (cd dist && sha256sum "${stage}.tar.gz" >> checksums.txt)
            echo "Built dist/${stage}.tar.gz"
          }

          build darwin arm64
          build linux amd64
          cat dist/checksums.txt

      - name: Publish GitHub Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt

      - name: Bump Homebrew tap formula
        if: steps.ver.outputs.release == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${TAP_TOKEN}" ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set — skipping tap bump. Set it to auto-update brew."
            exit 0
          fi
          darwin_sha="$(awk '/darwin_arm64/ {print $1}' dist/checksums.txt)"
          linux_sha="$(awk '/linux_amd64/ {print $1}' dist/checksums.txt)"
          if [[ -z "${darwin_sha}" || -z "${linux_sha}" ]]; then
            echo "::error::could not read checksums" && exit 1
          fi

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/imhassla/homebrew-tap.git" tap
          cat > tap/Formula/open-agent.rb <<EOF
          class OpenAgent < Formula
            desc "Cost-ladder agentic CLI over OpenRouter"
            homepage "https://github.com/imhassla/open-agent"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/imhassla/open-agent/releases/download/v${VERSION}/open-agent_${VERSION}_darwin_arm64.tar.gz"
                sha256 "${darwin_sha}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/imhassla/open-agent/releases/download/v${VERSION}/open-agent_${VERSION}_linux_amd64.tar.gz"
                sha256 "${linux_sha}"
              end
            end

            def install
              bin.install "open-agent"
            end

            def caveats
              <<~CAVEATS
                Set an OpenRouter API key (first match wins):
                  export OPENROUTER_KEY=sk-or-...
                  or put it in ~/.config/open-agent/.env
              CAVEATS
            end

            test do
              assert_match "open-agent", shell_output("#{bin}/open-agent version")
            end
          end
          EOF

          cd tap
          git config user.name "imhassla"
          git config user.email "imhassla@users.noreply.github.com"
          git add Formula/open-agent.rb
          if git diff --cached --quiet; then
            echo "tap already at v${VERSION}"
          else
            git commit -m "open-agent ${VERSION}"
            git push
            echo "Bumped tap to v${VERSION}"
          fi
